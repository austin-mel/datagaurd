[project]
name = "dataguard-backend"
version = "0.5.0"
description = "Tabular data quality API with dataset-specific validation and immutable history."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "pandas>=2.2,<4",
    "PyYAML>=6,<7",
    "SQLAlchemy>=2.1,<3",
    "alembic>=1.14,<2",
    "openpyxl>=3.1,<4",
    "pyarrow>=20,<26",
    "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<4",
    "types-PyYAML>=6,<7",
    "types-openpyxl>=3.1,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest_tmp"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

